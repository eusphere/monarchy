name: Test
on:
  workflow_call:
jobs:
  Server:
    runs-on: ubuntu-latest
    steps:
      - name: Cloning source
        uses: actions/checkout@v4
      - name: Installing bazel
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.30.0/bazelisk-linux-amd64 \
            --output "$RUNNER_TEMP/bazel"
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Installing bazel cache
        uses: actions/cache@v3
        with:
          path: "~/.cache/bazel"
          key: bazel
      - name: Running tests
        run: |
          bazel test //...
  Client-web:
    runs-on: ubuntu-latest
    steps:
      - name: Cloning source
        uses: actions/checkout@v4
      - name: Installing module cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: './clients/web/yarn.lock'
      - name: Running tests
        working-directory: ./clients/web
        run: |
          yarn
          yarn tsc
  Client-web-devel:
    runs-on: ubuntu-latest
    steps:
      - name: Cloning source
        uses: actions/checkout@v4
      - name: Installing module cache
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: './clients/web-devel/yarn.lock'
      - name: Running tests
        working-directory: ./clients/web-devel
        run: |
          yarn
          yarn tsc
