name: Test
on:
  workflow_call:
jobs:
  Server:
    runs-on: ubuntu-latest
    steps:
      - name: Cloning source
        uses: actions/checkout@v5
      - name: Installing bazel
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.30.0/bazelisk-linux-amd64 \
            --output "$RUNNER_TEMP/bazel"
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Installing bazel cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'MODULE.bazel', 'WORKSPACE', '.bazelrc') }}
          restore-keys: |
            bazel-${{ runner.os }}-
      - name: Running tests
        run: |
          bazel test //...
  Client-web:
    runs-on: ubuntu-latest
    steps:
      - name: Cloning source
        uses: actions/checkout@v5
      - name: Installing module cache
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: './clients/web/yarn.lock'
      - name: Running tests
        working-directory: ./clients/web
        run: |
          yarn install --frozen-lockfile
          yarn typecheck
          yarn build
  Client-web-devel:
    runs-on: ubuntu-latest
    steps:
      - name: Cloning source
        uses: actions/checkout@v5
      - name: Installing module cache
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: './clients/web-devel/yarn.lock'
      - name: Running tests
        working-directory: ./clients/web-devel
        run: |
          yarn
          yarn tsc
