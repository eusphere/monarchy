name: Publish
on:
  workflow_call:

permissions:
  contents: read
  id-token: write

jobs:
  Web:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: './clients/web/yarn.lock'
      - name: Build web client
        working-directory: ./clients/web
        run: |
          yarn install --frozen-lockfile
          yarn build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::930597685973:role/monarchy-github-actions
          aws-region: us-east-1
      - name: Upload web client
        run: |
          aws s3 sync clients/web/dist/ s3://monarchy1-web-930597685973/ \
            --exclude index.html --cache-control 'public,max-age=86400'
          aws s3 cp clients/web/dist/index.html \
            s3://monarchy1-web-930597685973/index.html \
            --content-type text/html --cache-control 'no-cache,no-store,must-revalidate'
          aws cloudfront create-invalidation --distribution-id E3JJVLS1E7JYV3 --paths '/*'
  Docker:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Cloning source
        uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Installing bazel
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/bazelbuild/bazelisk/releases/download/v1.30.0/bazelisk-linux-amd64 \
            --output "$RUNNER_TEMP/bazel"
          chmod +x "$RUNNER_TEMP/bazel"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Configuring AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::930597685973:role/monarchy-github-actions
          aws-region: us-east-1
      - name: Installing bazel cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel.lock', 'MODULE.bazel', 'WORKSPACE', '.bazelrc') }}
          restore-keys: |
            bazel-${{ runner.os }}-
      - name: Pushing image
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          REPO="$AWS_ACCOUNT_ID.dkr.ecr.us-east-1.amazonaws.com"
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $REPO
          bazel run //server/src/web:web-image-push
  Secrets:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Cloning source
        uses: actions/checkout@v5
      - name: Checking for changed paths
        id: secrets_changed
        uses: dorny/paths-filter@v4
        with:
          filters: |
            secrets:
              - 'infra/secrets/**'
      - name: Configuring AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::930597685973:role/monarchy-github-actions
          aws-region: us-east-1
      - name: Replacing encrypted secrets
        run: |
          SECRET_B64="$(base64 -w 0 infra/secrets/production.env.sops)"
          ./infra/ec2-run.sh \
            "if test -s /opt/monarchy/secrets/production.env.sops && test '${{ steps.secrets_changed.outputs.secrets }}' != true; then exit 0; fi" \
            "umask 077" \
            "install -d -m 700 /opt/monarchy/secrets" \
            "printf %s '${SECRET_B64}' | base64 -d > /opt/monarchy/secrets/production.env.sops" \
            "chown root:root /opt/monarchy/secrets/production.env.sops" \
            "chmod 600 /opt/monarchy/secrets/production.env.sops"
  Schema:
    needs: Secrets
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Cloning source
        uses: actions/checkout@v5
      - name: Configuring AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::930597685973:role/monarchy-github-actions
          aws-region: us-east-1
      - name: Running database migrations
        run: |
          MIGRATIONS_B64="$(tar -czf - -C database migrations flyway.conf ec2-migrate.sh | base64 -w 0)"
          ./infra/ec2-run.sh \
            "umask 077" \
            "install -d -m 755 /opt/monarchy/migrations" \
            "printf %s '${MIGRATIONS_B64}' | base64 -d | tar -xzf - -C /opt/monarchy" \
            "chown -R root:root /opt/monarchy/migrations" \
            "install -m 700 /opt/monarchy/ec2-migrate.sh /usr/local/bin/monarchy-migrate" \
            "/usr/local/bin/monarchy-migrate"
