name: Merge
run-name: ${{ github.actor }} pushed to master
on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write
  
jobs:
  Test:
    uses: ./.github/workflows/test.yml

  Publish:
    needs: [Test]
    uses: ./.github/workflows/publish.yml

  PublishWeb:
    needs: [Test]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: './clients/web/yarn.lock'
      - name: Build web client
        working-directory: ./clients/web
        run: |
          yarn install --frozen-lockfile
          yarn build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::930597685973:role/monarchy-github-actions
          aws-region: us-east-1
      - name: Upload web client
        run: |
          aws s3 sync clients/web/dist/ s3://monarchy1-web-930597685973/ \
            --exclude index.html --cache-control 'public,max-age=86400'
          aws s3 cp clients/web/dist/index.html \
            s3://monarchy1-web-930597685973/index.html \
            --content-type text/html --cache-control 'no-cache,no-store,must-revalidate'
          aws cloudfront create-invalidation --distribution-id E3JJVLS1E7JYV3 --paths '/*'

  Restart:
    needs: [Publish]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Cloning source
        uses: actions/checkout@v4
      - name: Configuring AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::930597685973:role/monarchy-github-actions
          aws-region: us-east-1
      - name: Restarting API
        run: |
          PAYLOAD="$(tar -czf - -C infra sync-runtime.sh user-data.sh.tftpl | base64 -w 0)"
          ./infra/ec2-run.sh \
            "install -d /opt/monarchy" \
            "printf %s '$PAYLOAD' | base64 -d | tar -xzf - -C /opt/monarchy" \
            "bash /opt/monarchy/sync-runtime.sh" \
            "/usr/local/bin/monarchy-update"
