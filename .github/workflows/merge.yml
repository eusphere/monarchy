name: Merge
run-name: ${{ github.actor }} pushed to master
on:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write
  
jobs:
  Test:
    uses: ./.github/workflows/test.yml

  Publish:
    needs: [Test]
    uses: ./.github/workflows/publish.yml

  Restart:
    needs: [Publish]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Cloning source
        uses: actions/checkout@v4
      - name: Configuring AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::930597685973:role/monarchy-github-actions
          aws-region: us-east-1
      - name: Restarting API
        run: |
          PAYLOAD="$(tar -czf - -C infra sync-runtime.sh user-data.sh.tftpl | base64 -w 0)"
          ./infra/ec2-run.sh \
            "install -d /opt/monarchy" \
            "printf %s '$PAYLOAD' | base64 -d | tar -xzf - -C /opt/monarchy" \
            "bash /opt/monarchy/sync-runtime.sh" \
            "/usr/local/bin/monarchy-update"
